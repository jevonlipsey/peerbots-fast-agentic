<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Peerbots Phone Microphone</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1}

/* our overlay sits above the peerbots iframe, which paints its own opaque ui */
#start{position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%);padding:24px 32px;font-size:22px;font-weight:600;border:0;border-radius:16px;background:#fff;color:#111;box-shadow:0 10px 40px #000a;text-align:center;line-height:1.25}
#start small{display:block;font-size:13px;font-weight:400;color:#555;margin-top:6px}
#start:disabled{opacity:.6}

#bar{position:fixed;z-index:9999;left:8px;bottom:8px;display:flex;align-items:center;gap:8px;color:#fff;background:#000c;padding:7px 11px;border-radius:8px;font-size:13px;pointer-events:none;max-width:88vw}
#meter{width:60px;height:6px;border-radius:3px;background:#fff3;overflow:hidden;flex:none}
#fill{height:100%;width:0%;background:#3ddc84;transition:width .06s linear}
</style>
</head>
<body>
<iframe src="https://app.peerbots.org/face" allow="autoplay; camera; microphone; fullscreen" allowfullscreen></iframe>
<button id="start">Enable microphone<small>so the robot can hear you</small></button>
<div id="bar"><span id="status">Not connected</span><span id="meter"><span id="fill"></span></span></div>
<script>
const startBtn=document.getElementById('start'),statusEl=document.getElementById('status'),fillEl=document.getElementById('fill');
let audioContext,stream,socket,processor;
const setStatus=t=>{statusEl.textContent=t;};

// websocket may drop when the phone sleeps or the laptop process restarts, so keep retrying.
// guarded so overlapping retries cannot stack up into a socket storm - the server
// only accepts one client and rejects the rest, which looks like a broken mic.
let retryTimer=null,retryDelay=1500,failStreak=0;

function closeSocket(){
  if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}
  if(socket){
    const stale=socket;socket=null;
    stale.onopen=stale.onclose=stale.onerror=stale.onmessage=null;
    try{stale.close();}catch(e){}
  }
}

function connectSocket(){
  closeSocket();
  const proto=location.protocol==='https:'?'wss://':'ws://';
  setStatus('Connecting…');
  const s=new WebSocket(proto+location.host+'/audio'+location.search);
  socket=s;
  s.binaryType='arraybuffer';
  let openedOnce=false;
  s.onopen=()=>{
    openedOnce=true;
    failStreak=0;retryDelay=1500;
    setStatus('Live — speak');
    startBtn.style.display='none';
  };
  s.onclose=()=>{
    if(socket!==s)return;// superseded by a newer attempt, do not double-schedule
    socket=null;
    failStreak++;
    // a close before ever opening means the handshake was refused: the laptop
    // is not serving, or another tab already owns the single mic stream
    if(!openedOnce&&failStreak>=2){
      setStatus('Refused — laptop not running, or another tab is already streaming');
      startBtn.style.display='';
      startBtn.disabled=false;
      return;
    }
    if(failStreak>=4){
      setStatus('Lost the laptop — tap retry');
      startBtn.style.display='';
      startBtn.disabled=false;
      return;
    }
    retryDelay=Math.min(Math.round(retryDelay*1.6),8000);
    setStatus(failStreak>1?'Reconnecting… ('+failStreak+')':'Reconnecting…');
    retryTimer=setTimeout(connectSocket,retryDelay);
  };
  s.onerror=()=>{setStatus('Socket error — is the laptop still running?');};
  // the laptop sends tts back down this same socket; binary = wav to speak on the handset
  s.onmessage=(event)=>{
    if(event.data instanceof ArrayBuffer){enqueueClip(event.data);return;}
    // text frames are control messages from the laptop, not speech
    try{
      const msg=JSON.parse(event.data);
      if(msg&&msg.type==='interrupt')stopSpeaking();
    }catch(e){}
  };
}

// speech plays through the same audioContext the mic uses, so the tap that
// enables the microphone also unlocks playback for the whole session
let speechQueue=[],speakingClip=false,liveSource=null;

// the laptop used to guess when the handset had finished speaking by adding the
// clip duration to the time it sent the bytes. decode and wifi both drift, so the
// microphone could reopen while lulo was still talking. the browser is the only
// thing that actually knows, so it says so.
function notify(type){
  if(!socket||socket.readyState!==WebSocket.OPEN)return;
  try{socket.send(JSON.stringify({type:type}));}catch(e){}
}

function enqueueClip(arrayBuffer){
  if(!audioContext)return;
  audioContext.decodeAudioData(arrayBuffer.slice(0)).then(buf=>{
    speechQueue.push(buf);
    playNextClip();
  }).catch(()=>{});
}

function playNextClip(){
  if(speakingClip||!audioContext)return;
  if(!speechQueue.length){
    // nothing queued behind the clip that just ended, so the turn's audio is done
    if(liveSource){liveSource=null;notify('playback_done');}
    return;
  }
  speakingClip=true;
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  const src=audioContext.createBufferSource();
  src.buffer=speechQueue.shift();
  src.connect(audioContext.destination);
  const first=!liveSource;
  liveSource=src;
  src.onended=()=>{speakingClip=false;if(liveSource===src)playNextClip();};
  src.start();
  // time-to-audible is the number that matters, and only the handset knows when
  // sound actually left the speaker
  if(first)notify('playback_started');
}

// barge-in: drop whatever is queued and cut the clip that is sounding right now.
// clearing liveSource first stops the onended handler pulling the next clip.
function stopSpeaking(){
  speechQueue=[];
  const src=liveSource;
  liveSource=null;
  speakingClip=false;
  if(src){
    try{src.onended=null;src.stop();}catch(e){}
  }
  notify('playback_stopped');
}

startBtn.onclick=async()=>{
  startBtn.disabled=true;
  try{
    // the noise gate and auto gain default to chrome's phone-call tuning, which
    // assumes a mouth 2cm away. at arm's length the gate cuts word onsets down to
    // digital silence and the auto gain pumps the room noise floor up until the vad
    // fires on it, so both stay off and whisper handles level.
    // echo cancellation is a separate subsystem and does stay on: it is a linear
    // canceller keyed on the known playback signal, so it never touches word onsets,
    // and this handset is speaker and microphone at once. without it lulo hears her
    // own tts coming back in and barges in on herself.
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false},video:false});
  }catch(err){
    setStatus('Mic blocked ('+err.name+') — allow mic in browser settings');
    startBtn.disabled=false;
    return;
  }
  try{
    audioContext=new (window.AudioContext||window.webkitAudioContext)();
    await audioContext.resume();
    const source=audioContext.createMediaStreamSource(stream);
    // ScriptProcessor is deprecated but is the only node available without an extra served worklet file
    processor=audioContext.createScriptProcessor(4096,1,1);
    const mute=audioContext.createGain();mute.gain.value=0;
    source.connect(processor);processor.connect(mute);mute.connect(audioContext.destination);

    let carry=new Float32Array(0);
    processor.onaudioprocess=(event)=>{
      const input=event.inputBuffer.getChannelData(0);

      // level meter so it is obvious the mic is actually capturing, not just connected
      let sum=0;
      for(let i=0;i<input.length;i++)sum+=input[i]*input[i];
      fillEl.style.width=Math.min(100,Math.sqrt(sum/input.length)*400)+'%';

      if(!socket||socket.readyState!==WebSocket.OPEN)return;
      const joined=new Float32Array(carry.length+input.length);
      joined.set(carry);joined.set(input,carry.length);
      const ratio=audioContext.sampleRate/16000;
      const count=Math.floor(joined.length/ratio);
      if(!count){carry=joined;return;}
      const out=new Int16Array(count);
      // average every source sample that falls inside the output sample's window
      // rather than point-sampling two of them. linear interpolation is no kind of
      // low-pass, so at 48k everything above 8k folds straight back into the band
      // as aliasing noise, which costs vad probability quality and stt accuracy at
      // the same time.
      const win=Math.max(1,Math.round(ratio));
      for(let i=0;i<count;i++){
        const start=Math.round(i*ratio);
        let acc=0,n=0;
        for(let j=start;j<start+win&&j<joined.length;j++){acc+=joined[j];n++;}
        const sample=Math.max(-1,Math.min(1,n?acc/n:0));
        out[i]=sample<0?sample*32768:sample*32767;
      }
      carry=joined.slice(Math.floor(count*ratio));
      // drop audio rather than let a backed-up socket grow without bound
      if(socket.bufferedAmount<262144)socket.send(out.buffer);
    };

    connectSocket();
  }catch(err){
    setStatus('Audio error: '+err.message);
    startBtn.disabled=false;
  }
};
</script>
</body>
</html>
